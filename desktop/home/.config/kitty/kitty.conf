# Retro Amber CRT
include retro-crt.conf

# Editors own navigation and selection.
map ctrl+shift+up
map ctrl+shift+down
map ctrl+shift+left
map ctrl+shift+right
map ctrl+shift+page_up
map ctrl+shift+page_down
map ctrl+shift+home
map ctrl+shift+end

# Hyprland owns windows; terminal programs own their panes.
map ctrl+shift+enter
map --allow-fallback=shifted,ascii ctrl+shift+n
map --allow-fallback=shifted,ascii ctrl+shift+w
map ctrl+shift+[
map ctrl+shift+]
map --allow-fallback=shifted,ascii ctrl+shift+f
map --allow-fallback=shifted,ascii ctrl+shift+b
map ctrl+shift+`
map --allow-fallback=shifted,ascii ctrl+shift+r
map ctrl+shift+0
map ctrl+shift+1
map ctrl+shift+2
map ctrl+shift+3
map ctrl+shift+4
map ctrl+shift+5
map ctrl+shift+6
map ctrl+shift+7
map ctrl+shift+8
map ctrl+shift+9
map ctrl+shift+f7
map ctrl+shift+f8

# Terminal programs own their tabs and layouts.
map ctrl+tab
map ctrl+shift+tab
map --allow-fallback=shifted,ascii ctrl+shift+t
map --allow-fallback=shifted,ascii ctrl+shift+q
map ctrl+shift+.
map ctrl+shift+,
map --allow-fallback=shifted,ascii ctrl+shift+alt+t
map --allow-fallback=shifted,ascii ctrl+shift+l
