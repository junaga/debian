# Fira Code with the amber desktop palette.
font_family Fira Code
font_size 11.0

foreground #ffb84d
background #050300
background_opacity 0.88
background_blur 0
dynamic_background_opacity yes
transparent_background_colors #050300@0.88 #000000@0.88 #080808@0.88 #0d1117@0.88 #101010@0.88 #121212@0.88 #1a1a1a@0.88

cursor #ffd28a
cursor_text_color #120800
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 80
cursor_trail_decay 0.08 0.22
cursor_trail_start_threshold 2
cursor_trail_color #ffb84d

selection_foreground #120800
selection_background #ffb84d
mark1_foreground #120800
mark1_background #ffb84d
mark2_foreground #120800
mark2_background #d8912f
mark3_foreground #120800
mark3_background #ffd28a

color0  #120800
color1  #c75f3a
color2  #8fa64a
color3  #d8912f
color4  #71889a
color5  #a66f91
color6  #709b93
color7  #ffb84d
color8  #5a340b
color9  #ff7655
color10 #b9d86a
color11 #ffd28a
color12 #9db9cc
color13 #d99cbd
color14 #9fd2c8
color15 #ffe8c2

window_padding_width 0
placement_strategy top-left
active_border_color #ffb84d
inactive_border_color #3a2208
bell_border_color #ffd28a
tab_bar_background #050300
active_tab_foreground #120800
active_tab_background #ffb84d
inactive_tab_foreground #d8912f
inactive_tab_background #160b02
tab_title_template "{title}"
dim_opacity 0.62

# Keep Kitty focused on terminal I/O and presentation.
wheel_scroll_multiplier 3.0

clear_all_shortcuts yes
map ctrl+shift+c copy_or_noop
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
map ctrl+shift+u kitten unicode_input
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
