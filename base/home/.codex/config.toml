# Disable update and experimental-feature dialogs.
check_for_update_on_startup = false
suppress_unstable_features_warning = true

# Allow structured questions outside `/plan` mode.
features.default_mode_request_user_input = true

# Use Luna for subagents; typical local tasks consume 90% fewer credits than Terra.
agents.default_subagent_model = "gpt-5.6-luna"

[tui]
resume_cwd = "current"
status_line = ["model-with-reasoning", "current-dir", "thread-title"]
