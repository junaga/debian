check_for_update_on_startup = false

model_reasoning_effort = "low"

[features]
# Experimental: allow structured choice prompts in Default mode, not only Plan mode.
default_mode_request_user_input = true

[agents]
# Keep delegation cheap and serial; named budget agents can pin their own model.
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[plugins."computer-use@openai-bundled"]
enabled = true

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["current-dir", "git-branch", "model-with-reasoning"]
