check_for_update_on_startup = false
suppress_unstable_features_warning = true
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"

[features]
# Experimental: allow structured choice prompts in Default mode, not only Plan mode.
default_mode_request_user_input = true

[agents]
# One serial Luna worker keeps delegation predictable and inexpensive.
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[tui]
session_picker_view = "comfortable"
resume_cwd = "current"
status_line = ["thread-title", "current-dir", "git-branch", "model-with-reasoning"]

[notice]
hide_rate_limit_model_nudge = true

[plugins."computer-use@openai-bundled"]
enabled = true
