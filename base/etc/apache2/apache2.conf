# Technical defaults
DefaultRuntimeDir ${APACHE_RUN_DIR}
PidFile ${APACHE_PID_FILE}
ErrorLog syslog
TypesConfig /etc/mime.types

# Modules
IncludeOptional /etc/apache2/mods-enabled/*.load
IncludeOptional /etc/apache2/mods-enabled/alias.conf
IncludeOptional /etc/apache2/mods-enabled/autoindex.conf


# ============================================================
# Local Workspace Server
# ============================================================

# TODO: Revisit local HTTPS later; keep the workspace server HTTP-only for now.
Listen 127.0.0.1:80

<VirtualHost 127.0.0.1:80>
    DocumentRoot /usr/local

    Alias /_workspace.css /etc/apache2/workspace.css
    Alias /_autoindex.html /etc/apache2/autoindex.html
    HeaderName /_autoindex.html

    # Full access
    <Directory /usr/local>
        Require all granted
        AllowOverride All
        Options Indexes FollowSymLinks
        IndexOptions +FoldersFirst
        IndexIgnoreReset On
        IndexIgnore ..
    </Directory>
</VirtualHost>
